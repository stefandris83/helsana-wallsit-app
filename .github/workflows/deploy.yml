name: Build und Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, Typecheck und Tests
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Build
        env:
          # Projekt-Pages liegen unter https://<konto>.github.io/<repository>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Zugangscode fuer /admin. KEIN produktiver Authentisierungsmechanismus:
          # der Wert wird in das ausgelieferte JavaScript kompiliert und ist damit
          # fuer jede Besucherin und jeden Besucher lesbar (siehe README).
          VITE_ADMIN_CODE: ${{ secrets.VITE_ADMIN_CODE || 'pilot-admin-demo' }}
          # Feature-Flag «Pause ueberspringen» (B.13.5). Freigegeben durch den
          # Auftraggeber am 11.08.2026; siehe README, Abschnitt «Vorentscheide».
          VITE_FEATURE_SKIP_REST: 'true'
          # Anleitungsvideo (§17, B.13.4). Externe Quelle bei Physitrack, fuer die
          # Live-Version freigegeben durch den Auftraggeber am 12.08.2026. Der
          # Abruf erfolgt aus dem Browser der Testperson heraus; siehe README und
          # docs/schnittstellen.md. Ueber Repository-Variablen ueberschreibbar.
          VITE_INSTRUCTION_VIDEO_URL: ${{ vars.INSTRUCTION_VIDEO_URL || 'https://media.physitrack.com/exercises/78c2dfb7-ca1e-4bb4-9c83-aeb2881edb5a/en/video_1280x720.mp4' }}
          # Untertitelspur liegt fuer dieses Demo-Video nicht vor.
          VITE_INSTRUCTION_VIDEO_TRACK_URL: ${{ vars.INSTRUCTION_VIDEO_TRACK_URL }}
          VITE_MIN_GROUP_SIZE: '5'
          # Ablageordner fuer freiwillig geteilte Ergebnisberichte.
          # Diese beiden Werte sind bewusst keine Secrets: der Schluessel darf
          # ausschliesslich hochladen, nicht lesen und nicht auflisten, und er
          # wird ohnehin im Browser ausgeliefert. Ueber Repository-Variablen
          # ueberschreibbar, ohne den Workflow zu aendern.
          VITE_REPORT_UPLOAD_URL: ${{ vars.REPORT_UPLOAD_URL || 'https://dooujsoadubsikihrvqw.supabase.co' }}
          VITE_REPORT_UPLOAD_KEY: ${{ vars.REPORT_UPLOAD_KEY || 'sb_publishable_t8isCuQdd7iF_SVLVuw06Q_c1dixx7c' }}
          VITE_REPORT_UPLOAD_BUCKET: ${{ vars.REPORT_UPLOAD_BUCKET || 'berichte' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
